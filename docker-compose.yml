# Starts PostgreSQL and the API.
#   docker compose up -d db          -> only the database (run the API yourself)
#   docker compose up --build        -> database + API (tables are created on start)
# The React client is run separately with `npm run dev` in ./client.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sweety
      POSTGRES_PASSWORD: sweety
      POSTGRES_DB: sweety
    ports:
      - "5432:5432"
    volumes:
      - sweety-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweety -d sweety"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://sweety:sweety@db:5432/sweety
      JWT_SECRET: change-me-in-real-use
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"

volumes:
  sweety-data:
